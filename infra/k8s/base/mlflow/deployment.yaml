apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:latest
        command:
        - /bin/sh
        - -c
        - |
          pip install psycopg2-binary && \
          mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --allowed-hosts "*" \
          --backend-store-uri postgresql://user:password@postgres-service:5432/mlflow \
          --default-artifact-root s3://mlflow/artifacts
        env:
        - name: MLFLOW_S3_ENDPOINT_URL
          value: http://minio-service:9000
        - name: AWS_ACCESS_KEY_ID
          value: minioadmin
        - name: AWS_SECRET_ACCESS_KEY
          value: minioadmin
        ports:
        - containerPort: 5000
